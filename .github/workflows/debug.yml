name: Debug Token Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test API from runner
        env:
          TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          UID: ${{ secrets.WORKBUDDY_UID }}
        run: |
          echo "token 长度: ${#TOKEN}, uid 长度: ${#UID}"
          for domain in www.codebuddy.cn www.workbuddy.cn copilot.tencent.com; do
            code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 20 \
              -X POST "https://$domain/v2/billing/meter/checkin-activity-status" \
              -H "Authorization: Bearer $TOKEN" -H "X-User-Id: $UID" \
              -H "Content-Type: application/json" -H "User-Agent: WorkBuddy/5.8.3" \
              -d '{}')
            echo "$domain -> HTTP $code"
            head -c 200 /tmp/resp.txt; echo
          done
          echo "--- runner 出口 IP ---"
          curl -s --max-time 15 https://ipinfo.io/json | head -c 300; echo
